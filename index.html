    <title>Sahil Soni | AI & ML Engineer</title>
    <!-- This address only forwards to the portfolio. GitHub Pages cannot send a server redirect, so the page does it:

         engines which address is the real one. -->
    <script>location.replace('https://sahilsonii.dpdns.org' + location.pathname + location.search + location.hash)</script>
    <meta http-equiv="refresh" content="0; url=https://sahilsonii.dpdns.org/" />
    <link rel="canonical" href="https://sahilsonii.dpdns.org/" />
    <meta name="robots" content="noindex, follow" />
  </head>
  <body>
    <p>Sahil Soni's portfolio has moved to <a href="https://sahilsonii.dpdns.org/">sahilsonii.dpdns.org</a>.</p>
